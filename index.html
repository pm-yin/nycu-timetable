        const PALETTES = [
            { border: 'border-l-4 border-l-blue-500', bg: 'bg-blue-50/95 hover:bg-blue-100/90', text: 'text-blue-950', badge: 'bg-blue-200 text-blue-900', picker: 'bg-blue-500' },

            { border: 'border-l-4 border-l-amber-500', bg: 'bg-amber-50/95 hover:bg-amber-100/90', text: 'text-amber-950', badge: 'bg-amber-200 text-amber-900', picker: 'bg-amber-500' },

        let currentStudentId = "default";
        let courses = [];
        let dismissedWarnings = [];

        window.onload = function() {

        function loginStudent() {
            const idInput = document.getElementById('studentIdInput').value.trim();
            if (!idInput) {
                alert("請先輸入學號或課表代號！");
                return;
            }
            if (isCloudMode && /[\.\#\$\[\]]/.test(idInput)) {
                alert("代號請勿包含 . # $ [ ] 等符號");
                return;
            }

            currentStudentId = idInput;
            dismissedWarnings = [];
            const statusNode = document.getElementById('syncStatus');
            statusNode.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 animate-ping"></span> 載入中...`;

            if (isCloudMode) {
                db.ref('nycu_schedules/' + currentStudentId).on('value', (snapshot) => {
                    const data = snapshot.val();
                    courses = data ? data : [];
                    statusNode.className = "text-xs px-2 py-1 rounded bg-emerald-50 text-emerald-700 flex items-center gap-1 font-bold border border-emerald-200";
                    statusNode.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 雲端連線中: ${currentStudentId}`;
                    refreshUI();
                });
            } else {
                loadData();
                statusNode.className = "text-xs px-2 py-1 rounded bg-blue-50 text-blue-700 flex items-center gap-1 font-bold border border-blue-200";
                statusNode.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500"></span> 本地學號: ${currentStudentId}`;
                refreshUI();
            }
        }

        function saveData() {
            if (isCloudMode) {
                db.ref('nycu_schedules/' + currentStudentId).set(courses);
            } else {
                localStorage.setItem('nycu_courses_' + currentStudentId, JSON.stringify(courses));
            }
        }

        function loadData() {
            const stored = localStorage.getItem('nycu_courses_' + currentStudentId);
            if (stored) {
                try { courses = JSON.parse(stored); } catch(e) { courses = []; }
            } else {
                courses = [];
            }
        }

        function refreshUI() {
            renderTimetable();
            renderCourseList();
            checkConflicts();
        }

        function saveAndRefresh() {
            saveData();
            if (!isCloudMode) {
                refreshUI();
            }
        }

        function parseLocation(locationStr) {
            if (!locationStr) return { full: '未指定教室', short: '未指定', campus: '未知校區' };
            let matchedCode = '';
            let matchedData = null;
            const sortedCodes = Object.keys(CLASSROOM_DATABASE).sort((a, b) => b.length - a.length);
            for (let code of sortedCodes) {
                if (locationStr.startsWith(code)) { matchedCode = code; matchedData = CLASSROOM_DATABASE[code]; break; }
            }
            if (matchedData) {
                return { full: `${matchedData.campus}校區 ${matchedData.building} ${locationStr.substring(matchedCode.length)}`, short: `${matchedData.building} ${locationStr.substring(matchedCode.length)}`, campus: matchedData.campus };
            }
            return { full: locationStr, short: locationStr, campus: '未知校區' };
        }

        function parseLine(line) {
            line = line.trim(); if (!line) return null;
            const nycuPattern = /([MTWRFSU]+)([yz1-9nabcd]+)-([A-Za-z0-9]+)\[([A-Z]+)\]/;
            const match = line.match(nycuPattern);
            if (!match) return null;

            const fullTimeToken = match[0], daysPart = match[1], periodsPart = match[2], location = match[3];
            const tokenIndex = line.indexOf(fullTimeToken);
            let beforeToken = line.substring(0, tokenIndex).trim();
            let afterToken = line.substring(tokenIndex + fullTimeToken.length).trim();

            beforeToken = beforeToken.replace(/^\d+[上下]/, '').replace(/^\d{5,6}/, '').replace(/^[A-Za-z0-9{5,10}/, '').replace(/[\d\s]+$/, '').replace(/(不限|無限制)\s*\d*$/, '');
            let name = beforeToken.trim() || "未命名課程";
            afterToken = afterToken.replace(/^[\d\.\s]+/, '').replace(/(選修|必修|必選修)$/, '');
            let teacher = afterToken.trim() || "未指定教師";
            const locInfo = parseLocation(location);

            return {
                id: 'course_' + Date.now() + Math.random().toString(36).substr(2, 5),
                name, teacher, rawTime: daysPart + periodsPart, location: locInfo.full, shortLocation: locInfo.short, campus: locInfo.campus,
                days: daysPart.split(''), periods: periodsPart.split(''), colorIndex: Math.floor(Math.random() * PALETTES.length)
            };
        }

            const text = document.getElementById('rawInput').value;
            const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const combinedLines = [];
            const nycuPattern = /([MTWRFSU]+)([yz1-9nabcd]+)-([A-Za-z0-9]+)\[([A-Z]+)\]/;

            for (let i = 0; i < rawLines.length; i++) {
                let current = rawLines[i];
                if (!nycuPattern.test(current) && i + 1 < rawLines.length && nycuPattern.test(rawLines[i + 1])) {
                    current = current + " " + rawLines[i + 1]; i++; 
                }
                combinedLines.push(current);
            }

            let addedCount = 0;
            combinedLines.forEach(line => {
                const course = parseLine(line);
                if (course) { courses.push(course); addedCount++; }
            });

            if (addedCount > 0) {
                document.getElementById('rawInput').value = '';
                saveAndRefresh();
            } else {
                alert('解析失敗。請確認格式正確，並包含如 "R234-HB204[GF]" 的代碼。');
            }
        }

        function openCourseDetail(id) {
            const course = courses.find(c => c.id === id); if (!course) return;
            document.getElementById('modalCourseName').innerText = course.name;
            document.getElementById('modalTeacher').innerText = course.teacher;
            document.getElementById('modalTime').innerText = `${course.rawTime} 節次`;
            document.getElementById('modalLocation').innerText = course.location;
            document.getElementById('modalCampusBadge').innerText = course.campus + '校區';

            const colorPickerContainer = document.getElementById('modalColorPicker');
            colorPickerContainer.innerHTML = '';
            PALETTES.forEach((palette, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-7 h-7 rounded-full ${palette.picker} transition transform hover:scale-110 ${course.colorIndex === idx ? 'ring-2 ring-offset-2 ring-slate-700 scale-105' : 'opacity-60'}`;
                btn.onclick = function() { course.colorIndex = idx; saveAndRefresh(); openCourseDetail(id); };
                colorPickerContainer.appendChild(btn);
            });

            document.getElementById('modalDeleteBtn').onclick = function() { deleteCourse(id); closeModal(); };
            document.getElementById('courseModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('courseModal').classList.add('hidden'); }
        function dismissWarning(warningId) { dismissedWarnings.push(warningId); checkConflicts(); }
        function deleteCourse(id) { courses = courses.filter(c => c.id !== id); saveAndRefresh(); }
        function clearAll() { if (confirm('確定要清空課表嗎？')) { courses = []; saveAndRefresh(); } }

        function checkConflicts() {
            const alertContainer = document.getElementById('alertContainer'); alertContainer.innerHTML = '';
            let warnings = [], scheduleGrid = {}, dayCampuses = {};

            courses.forEach(course => {
                course.days.forEach(day => {
                    if (!dayCampuses[day]) dayCampuses[day] = new Set();
                    if (course.campus && course.campus !== '未知校區') dayCampuses[day].add(course.campus);
                    course.periods.forEach(p => {
                        const slotKey = `${day}-${p}`;
                        if (!scheduleGrid[slotKey]) scheduleGrid[slotKey] = [];
                        scheduleGrid[slotKey].push(course);
                    });
                });
            });

            Object.keys(scheduleGrid).forEach(slotKey => {
                const list = scheduleGrid[slotKey];
                if (list.length > 1) {
                    const [day, p] = slotKey.split('-'), cNames = list.map(c => `「${c.name}」`).join(' 與 '), warningId = `conflict-${day}-${p}`;
                    if (!dismissedWarnings.includes(warningId)) {
                        warnings.push({ id: warningId, type: 'danger', msg: `【衝堂警告】${DAY_NAMES[day]}第 ${p} 節：${cNames} 發生時間重疊（已為您並排顯示）。` });
                    }
                }
            });

            Object.keys(dayCampuses).forEach(day => {
                const campuses = dayCampuses[day];
                if (campuses.size > 1) {
                    const campusList = Array.from(campuses).join(' ⇄ '), warningId = `commute-${day}`;
                    if (!dismissedWarnings.includes(warningId)) {
                        warnings.push({ id: warningId, type: 'warning', msg: `【跨校區通勤提醒】${DAY_NAMES[day]} 您的課程分佈在不同校區：${campusList}。` });
                    }
                }
            });

            warnings.forEach(w => {
                const bg = w.type === 'danger' ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-amber-50 border-amber-200 text-amber-800';
                const icon = w.type === 'danger' ? 'alert-triangle' : 'truck';
                const div = document.createElement('div');
                div.className = `flex items-center justify-between gap-3 p-3 border rounded-xl ${bg} text-sm font-medium shadow-sm transition modal-animate`;
                div.innerHTML = `
                    <div class="flex items-start gap-3"><i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 mt-0.5"></i><span>${w.msg}</span></div>
                    <button onclick="dismissWarning('${w.id}')" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg transition flex-shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>
                `;
                alertContainer.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderTimetable() {
            const tbody = document.getElementById('timetableBody'); tbody.innerHTML = '';
            Object.keys(TIME_CODES).forEach(key => {
                const slot = TIME_CODES[key], tr = document.createElement('tr');
                let tdTime = document.createElement('td');
                tdTime.className = "p-2 border border-slate-200 text-center bg-slate-50/80 sticky left-0 z-10 select-none";
                tdTime.innerHTML = `<div class="font-bold text-slate-700 text-sm">${slot.label}</div><div class="text-[10px] text-slate-400 mt-0.5 font-mono">${slot.time}</div>`;
                tr.appendChild(tdTime);

                DAYS.forEach(day => {
                    let tdDay = document.createElement('td');
                    tdDay.className = "p-1 border border-slate-200 vertical-align-top h-24 min-h-24 bg-white relative";
                    const slotCourses = courses.filter(c => c.days.includes(day) && c.periods.includes(key));

                    if (slotCourses.length > 0) {
                        const wrapper = document.createElement('div');
                        wrapper.className = "flex flex-row gap-1 h-full w-full overflow-hidden";
                        slotCourses.forEach(c => {
                            const p = PALETTES[c.colorIndex], card = document.createElement('div');
                            card.className = `p-1.5 rounded-xl border-l-4 text-left h-full flex flex-col justify-between transition hover:scale-[1.02] cursor-pointer flex-1 min-w-0 shadow-sm ${p.border} ${p.bg} ${p.text}`;
                            card.setAttribute('onclick', `openCourseDetail('${c.id}')`);
                            card.innerHTML = `
                                <div class="space-y-0.5">
                                    <div class="font-bold text-[11px] md:text-xs leading-tight break-all line-clamp-3">${c.name}</div>
                                    <div class="text-[10px] opacity-75 truncate">${c.teacher}</div>
                                </div>
                                <div class="text-[9px] mt-1 px-1 py-0.5 rounded inline-block w-fit font-medium truncate max-w-full ${p.badge}">${c.shortLocation}</div>
                            `;
                            wrapper.appendChild(card);
                        });
                        tdDay.appendChild(wrapper);
                    }
                    tr.appendChild(tdDay);
                });
                tbody.appendChild(tr);
            });
        }

        function renderCourseList() {
            const listContainer = document.getElementById('courseList'), countBadge = document.getElementById('courseCount');
            listContainer.innerHTML = ''; countBadge.innerText = courses.length;
            if (courses.length === 0) {
                listContainer.innerHTML = '<p class="text-slate-400 text-center py-4">目前尚未加入任何課程</p>'; return;
            }
            courses.forEach(c => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2 border rounded-xl bg-slate-50 border-slate-200 hover:bg-slate-100/70 transition`;
                div.innerHTML = `
                    <div class="flex-1 min-w-0 pr-2 cursor-pointer" onclick="openCourseDetail('${c.id}')">
                        <div class="font-bold text-slate-800 text-xs truncate">${c.name}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5 space-x-2 flex items-center"><span class="text-blue-600 font-bold font-mono">${c.rawTime}</span><span>|</span><span class="truncate">${c.teacher}</span></div>
                    </div>
                    <button onclick="deleteCourse('${c.id}')" class="text-slate-400 hover:text-rose-500 p-1 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                `;
                listContainer.appendChild(div);
            });
            lucide.createIcons();
        }
    </script>
</body>
